<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlackBerry Messenger (E2EE)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; -webkit-tap-highlight-color: rgba(0,0,0,0); }
        body, html { height: 100%; background: #000; overflow: hidden; }
        #app { max-width: 600px; margin: 0 auto; background: #fff; height: 100%; position: relative; overflow: hidden; }
        
        a:focus, button:focus, input:focus, .list-item:focus, .accordion:focus {
            outline: 2px solid #005B8A !important;
            background-color: #E1F5FE !important;
        }

        .bb-header { background: #000; color: #fff; padding: 6px 8px; border-bottom: 2px solid #333; overflow: hidden; display: flex; align-items: center; justify-content: space-between; }
        .avatar { width: 42px; height: 42px; background: #555; border-radius: 4px; border: 1px solid #ffcc00; float: left; margin-right: 8px; background-size: cover; background-position: center; flex-shrink: 0; }
        .avatar-sm { width: 32px; height: 32px; background: #ccc; border-radius: 3px; float: left; margin-right: 8px; background-size: cover; background-position: center; border: 1px solid #aaa; flex-shrink: 0; }
        .user-meta { float: left; overflow: hidden; flex-grow: 1; }
        .user-meta h1 { font-size: 14px; margin: 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pin-tag { color: #ffcc00; font-size: 11px; font-weight: bold; }
        .user-status-text { font-size: 11px; color: #ccc; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2e7d32; margin-right: 4px; }
        .offline-dot { background: #888888; }

        .accordion { background: #c5d0d8; color: #000; font-weight: bold; font-size: 13px; padding: 5px 8px; border-top: 1px solid #fff; border-bottom: 1px solid #888; clear: both; }
        .accordion.yellow { background: #fef1b5; border-bottom: 1px solid #d6c694; }

        #login-view { padding: 15px; background: #e8ecef; height: 100%; overflow-y: auto; text-align: center; }
        .input-field { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #888; border-radius: 3px; font-size: 13px; }
        .btn { padding: 8px 15px; background: #005B8A; color: #fff; font-weight: bold; border: 1px solid #003D5E; border-radius: 3px; cursor: pointer; font-size: 13px; }
        .btn-danger { background: #a00; border-color: #600; }
        .btn-secondary { background: #444; border-color: #222; }

        #home-view { height: 100%; display: none; }
        #home-content { height: calc(100% - 56px); overflow-y: auto; background: #fff; }

        .list-item { padding: 8px; border-bottom: 1px solid #eee; background: #fff; cursor: pointer; clear: both; overflow: hidden; }
        .list-item:active { background: #005B8A; color: #fff; }
        .list-item:active .status-msg { color: #d0e0ff; }
        .list-item .item-title { font-weight: bold; font-size: 13px; }
        .list-item .status-msg { font-size: 11px; color: #666; margin-top: 2px; }

        #chat-view { display: none; height: 100%; position: relative; background: #e8ecef; }
        #chat-header { background: #000; color: #fff; padding: 6px; border-bottom: 2px solid #005B8A; height: 45px; display: flex; align-items: center; }
        #back-btn { background: transparent; border: none; color: #fff; font-size: 20px; font-weight: bold; padding: 0 10px 0 4px; cursor: pointer; }
        #chat-title-text { font-weight: bold; font-size: 14px; margin-left: 6px; flex-grow: 1; }
        #chat-messages { height: calc(100% - 90px); overflow-y: auto; padding: 8px; display: flex; flex-direction: column; }

        .msg { margin-bottom: 8px; padding: 6px 8px; border-radius: 4px; font-size: 13px; max-width: 82%; position: relative; word-wrap: break-word; }
        .msg-in { background: #ffffff; border: 1px solid #ccc; align-self: flex-start; }
        .msg-out { background: #E1F5FE; border: 1px solid #B3E5FC; align-self: flex-end; }
        .msg-author { font-size: 10px; color: #005B8A; font-weight: bold; margin-bottom: 2px; }
        .msg-tick { font-size: 10px; font-weight: bold; color: #005B8A; margin-left: 5px; }
        .msg-read { color: #2e7d32; }

        .ping-bubble { background: #ffcdd2; border: 1px solid #e57373; color: #b71c1c; font-weight: bold; text-align: center; width: 95%; align-self: center; margin: 8px auto; }
        .ping-shake { animation: shake 0.3s ease-in-out infinite; }
        @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-8px, 0); } 50% { transform: translate(8px, 0); } 75% { transform: translate(-8px, 0); } 100% { transform: translate(0, 0); } }

        #input-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 45px; background: #ccc; padding: 6px; border-top: 1px solid #999; display: flex; gap: 4px; }
        #msg-input { flex: 1; padding: 6px; border: 1px solid #888; border-radius: 3px; font-size: 12px; }
        .chat-btn { width: 60px; height: 31px; font-size: 11px; padding: 0; }
        .clear { clear: both; }
    </style>
</head>
<body>
    <div id="app">
        
        <!-- LOGIN / REGISTER VIEW -->
        <div id="login-view">
            <h2 style="margin-bottom:10px; color:#005B8A;">BBM Messenger (E2EE)</h2>
            <input type="text" id="login-user" class="input-field" placeholder="Username (e.g. Nigel)" />
            <input type="password" id="login-pass" class="input-field" placeholder="Password" />
            <input type="text" id="login-status" class="input-field" placeholder="Status (e.g. Available - Chilling)" />
            <p style="text-align:left; font-size:11px; margin-bottom:3px; color:#444;">Profile Picture (Optional):</p>
            <input type="file" id="login-avatar" class="input-field" accept="image/*" />
            
            <button id="login-btn" class="btn" style="width:100%; margin-top:5px;" onclick="doLogin()">Sign In / Register</button>
            <br><br>
            <button class="btn btn-danger" style="width:100%; font-size:11px;" onclick="wipeDatabase()">Wipe Server Database (Reset All)</button>
        </div>

        <!-- HOME / MAIN VIEW -->
        <div id="home-view">
            <div class="bb-header">
                <div style="display:flex; align-items:center; overflow:hidden;">
                    <div class="avatar" id="my-avatar"></div>
                    <div class="user-meta">
                        <h1><span class="status-dot"></span><span id="my-name">---</span></h1>
                        <div class="pin-tag">PIN: <span id="my-pin">--------</span></div>
                        <div class="user-status-text" id="my-status">Available</div>
                    </div>
                </div>
                <button class="btn btn-secondary" style="font-size:10px; padding:4px 8px; white-space:nowrap;" onclick="doSignOut()">Sign Out</button>
            </div>

            <div id="home-content">
                <div style="padding: 6px; background: #e0e5e8; border-bottom: 1px solid #ccc; display:flex; gap:6px;">
                    <input type="text" id="add-pin-input" class="input-field" style="margin:0; flex:1;" placeholder="Enter BBM PIN..." />
                    <button class="btn" style="padding:6px 12px;" onclick="addContactByPin()">+ Contact</button>
                </div>

                <div class="accordion yellow">Recent Updates</div>
                <div id="recent-updates-list"></div>

                <div class="accordion">Contacts</div>
                <div id="contacts-list"></div>

                <div style="padding:10px;">
                    <button class="btn btn-secondary" style="width:100%; font-size:11px;" onclick="sendBroadcast()">Broadcast Message to All</button>
                </div>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="chat-view">
            <div id="chat-header">
                <button id="back-btn" onclick="showHome()">&lsaquo;</button>
                <div class="avatar-sm" id="chat-target-avatar"></div>
                <div id="chat-title-text">Chat</div>
                <span style="font-size: 9px; color: #00ffcc; background:#111; padding:2px 4px; border-radius:3px;">🔒 E2EE</span>
            </div>

            <div id="chat-messages"></div>

            <div id="input-bar">
                <input type="text" id="msg-input" placeholder="Type encrypted message..." />
                <button class="btn chat-btn" style="background:#a00; border-color:#600;" onclick="sendPing()">PING!</button>
                <button class="btn chat-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <script>
        let currentUser = null;
        let currentTarget = null;
        let keyPair = null;
        let sharedKeys = {};
        let ws = null;
        let base64Avatar = '';
        let state = { users: {}, messages: [], updates: [] };

        document.getElementById('login-avatar').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) { base64Avatar = evt.target.result; };
                reader.readAsDataURL(file);
            }
        });

        // --- WEB CRYPTO & PERSISTENCE ENGINE ---
        async function deriveAuthHash(password, username) {
            const enc = new TextEncoder();
            const buf = await crypto.subtle.digest('SHA-256', enc.encode(`${password}:${username}`));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function getOrCreateKeyPair(username) {
            const storageKey = 'bbm_e2ee_keys_' + username;
            const stored = localStorage.getItem(storageKey);

            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    const privateKey = await crypto.subtle.importKey("jwk", parsed.privateKey, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
                    const publicKey = await crypto.subtle.importKey("jwk", parsed.publicKey, { name: "ECDH", namedCurve: "P-256" }, true, []);
                    keyPair = { privateKey, publicKey };
                    return JSON.stringify(parsed.publicKey);
                } catch (err) {
                    console.warn("Corrupted keys found. Wiping and generating new keys.", err);
                    localStorage.removeItem(storageKey);
                }
            }

            const newKeyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
            const pubJwk = await crypto.subtle.exportKey("jwk", newKeyPair.publicKey);
            const privJwk = await crypto.subtle.exportKey("jwk", newKeyPair.privateKey);
            
            localStorage.setItem(storageKey, JSON.stringify({ privateKey: privJwk, publicKey: pubJwk }));
            keyPair = newKeyPair;
            return JSON.stringify(pubJwk);
        }

        async function getSharedKey(targetUser) {
            if (sharedKeys[targetUser]) return sharedKeys[targetUser];
            if (!state.users[targetUser] || !state.users[targetUser].pubKey) {
                throw new Error("Target user hasn't generated encryption keys yet.");
            }

            const targetPubKeyJwk = JSON.parse(state.users[targetUser].pubKey);
            const importedPubKey = await crypto.subtle.importKey("jwk", targetPubKeyJwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
            
            const sharedKey = await crypto.subtle.deriveKey(
                { name: "ECDH", public: importedPubKey },
                keyPair.privateKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
            sharedKeys[targetUser] = sharedKey;
            return sharedKey;
        }

        async function encryptPayload(targetUser, text) {
            const key = await getSharedKey(targetUser);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
            return {
                ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
                iv: btoa(String.fromCharCode(...iv))
            };
        }

        async function decryptPayload(senderUser, ciphertextB64, ivB64) {
            try {
                const key = await getSharedKey(senderUser);
                const ciphertext = Uint8Array.from(atob(ciphertextB64), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
                const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch(e) {
                return "[Unable to decrypt message]";
            }
        }

        // --- AUTH & NETWORK LOGIC ---
        async function doLogin(autoCreds) {
            const isAuto = autoCreds && typeof autoCreds.username === 'string';
            const u = isAuto ? autoCreds.username : document.getElementById('login-user').value.trim();
            const p = isAuto ? autoCreds.password : document.getElementById('login-pass').value.trim();
            const s = isAuto ? autoCreds.statusMessage : document.getElementById('login-status').value.trim();

            if (!u || !p) return alert('Username & Password required');

            const btn = document.getElementById('login-btn');
            if (btn) btn.innerText = 'Securing connection...';

            try {
                if (!window.crypto || !window.crypto.subtle) {
                    throw new Error("Your browser is blocking the Web Crypto API. Please use HTTPS or localhost.");
                }

                const authHash = await deriveAuthHash(p, u);
                const pubKeyStr = await getOrCreateKeyPair(u);

                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, authHash, pubKey: pubKeyStr, statusMessage: s, avatar: base64Avatar })
                });

                const data = await res.json();
                if (res.ok) {
                    currentUser = data.user;
                    localStorage.setItem('bbm_session', JSON.stringify({ username: u, password: p, statusMessage: s }));

                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('home-view').style.display = 'block';

                    document.getElementById('my-name').innerText = currentUser.username;
                    document.getElementById('my-pin').innerText = currentUser.pin;
                    document.getElementById('my-status').innerText = currentUser.statusMessage;
                    if (currentUser.avatar) document.getElementById('my-avatar').style.backgroundImage = 'url(' + currentUser.avatar + ')';

                    initRealtime();
                } else {
                    if (isAuto) localStorage.removeItem('bbm_session');
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error(err);
                alert("Login Error: " + err.message);
            } finally {
                if (btn) btn.innerText = 'Sign In / Register';
            }
        }

        function doSignOut() {
            localStorage.removeItem('bbm_session');
            location.reload();
        }

        function initRealtime() {
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'AUTH', username: currentUser.username }));
            };

            ws.onmessage = async (evt) => {
                const data = JSON.parse(evt.data);
                if (data.type === 'STATE_UPDATE') {
                    const prevLen = state.messages ? state.messages.length : 0;
                    state = data;

                    renderHome();
                    if (currentTarget) await renderChat();

                    if (state.messages.length > prevLen) {
                        const last = state.messages[state.messages.length - 1];
                        if (last.target === currentUser.username && last.isPing) triggerPingEffect();
                    }
                }
            };

            ws.onerror = () => { startPolling(); };
        }

        function startPolling() {
            setInterval(async () => {
                const res = await fetch('/api/sync?username=' + encodeURIComponent(currentUser.username));
                if (res.ok) {
                    state = await res.json();
                    renderHome();
                    if (currentTarget) await renderChat();
                }
            }, 2000);
        }

        async function wipeDatabase() {
            if (confirm('Are you sure you want to wipe all BBM data and start fresh?')) {
                const res = await fetch('/api/reset', { method: 'POST' });
                if (res.ok) {
                    localStorage.clear();
                    alert('Database wiped!');
                    location.reload();
                }
            }
        }

        async function addContactByPin() {
            const pin = document.getElementById('add-pin-input').value;
            if (!pin) return alert('Enter a PIN');

            const res = await fetch('/api/add-contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, pin })
            });

            const data = await res.json();
            if (res.ok) {
                alert('Contact added: ' + data.added);
                document.getElementById('add-pin-input').value = '';
            } else {
                alert(data.error);
            }
        }

        async function sendBroadcast() {
            const text = prompt('Enter message to broadcast to all contacts:');
            if (!text) return;

            const myContacts = state.users[currentUser.username]?.contacts || [];
            for (const contact of myContacts) {
                try {
                    const encrypted = await encryptPayload(contact, '[BROADCAST] ' + text);
                    ws.send(JSON.stringify({
                        type: 'SEND_MSG',
                        target: contact,
                        ciphertext: encrypted.ciphertext,
                        iv: encrypted.iv
                    }));
                } catch(e) {
                    console.error('Broadcast failed for contact:', contact);
                }
            }
        }

        function showHome() {
            currentTarget = null;
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            renderHome();
        }

        async function openChat(target) {
            currentTarget = target;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('chat-view').style.display = 'block';

            document.getElementById('chat-title-text').innerText = target;
            const
