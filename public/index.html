<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TestMessenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; -webkit-tap-highlight-color: rgba(0,0,0,0); }
        body, html { height: 100%; background: #000; overflow: hidden; }
        #app { max-width: 600px; margin: 0 auto; background: #fff; height: 100%; position: relative; overflow: hidden; }
        
        /* Trackpad Focus Styles for BB Curve 9360 */
        a:focus, button:focus, input:focus, .list-item:focus, .accordion:focus {
            outline: 2px solid #005B8A !important;
            background-color: #E1F5FE !important;
        }

        /* Profile Top Banner */
        .bb-header { background: #000; color: #fff; padding: 6px 8px; border-bottom: 2px solid #333; overflow: hidden; }
        .avatar { width: 42px; height: 42px; background: #555; border-radius: 4px; border: 1px solid #ffcc00; float: left; margin-right: 8px; background-size: cover; background-position: center; }
        .avatar-sm { width: 32px; height: 32px; background: #ccc; border-radius: 3px; float: left; margin-right: 8px; background-size: cover; background-position: center; border: 1px solid #aaa; }
        .user-meta { float: left; width: calc(100% - 60px); }
        .user-meta h1 { font-size: 14px; margin: 0; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pin-tag { color: #ffcc00; font-size: 11px; font-weight: bold; }
        .user-status-text { font-size: 11px; color: #ccc; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Status Dot Indicator */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2e7d32; margin-right: 4px; }
        .offline-dot { background: #888888; }

        /* BBM Accordion Headers */
        .accordion { background: #c5d0d8; color: #000; font-weight: bold; font-size: 13px; padding: 5px 8px; border-top: 1px solid #fff; border-bottom: 1px solid #888; clear: both; }
        .accordion.yellow { background: #fef1b5; border-bottom: 1px solid #d6c694; }

        /* Layout Views */
        #login-view { padding: 15px; background: #e8ecef; height: 100%; overflow-y: auto; text-align: center; }
        .input-field { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #888; border-radius: 3px; font-size: 13px; }
        .btn { padding: 8px 15px; background: #005B8A; color: #fff; font-weight: bold; border: 1px solid #003D5E; border-radius: 3px; cursor: pointer; font-size: 13px; }
        .btn-danger { background: #a00; border-color: #600; }
        .btn-secondary { background: #444; border-color: #222; }

        #home-view { height: 100%; display: none; }
        #home-content { height: calc(100% - 56px); overflow-y: auto; background: #fff; }

        /* Contact Lists */
        .list-item { padding: 8px; border-bottom: 1px solid #eee; background: #fff; cursor: pointer; clear: both; overflow: hidden; }
        .list-item:active { background: #005B8A; color: #fff; }
        .list-item:active .status-msg { color: #d0e0ff; }
        .list-item .item-title { font-weight: bold; font-size: 13px; font-style: italic; }
        .list-item .status-msg { font-size: 11px; color: #666; margin-top: 2px; }
        .list-item .time-stamp { float: right; font-size: 10px; color: #888; }

        /* Chat View Window */
        #chat-view { display: none; height: 100%; position: relative; background: #e8ecef; }
        #chat-header { background: #000; color: #fff; padding: 6px; border-bottom: 2px solid #005B8A; height: 45px; }
        #back-btn { background: transparent; border: none; color: #fff; font-size: 20px; font-weight: bold; float: left; padding: 0 10px 0 4px; cursor: pointer; }
        #chat-title-text { float: left; font-weight: bold; font-size: 14px; margin-top: 4px; }
        #chat-messages { height: calc(100% - 90px); overflow-y: auto; padding: 8px; }

        /* Chat Bubbles & Ticks */
        .msg { margin-bottom: 8px; padding: 6px 8px; border-radius: 4px; font-size: 13px; max-width: 82%; position: relative; }
        .msg-in { background: #ffffff; border: 1px solid #ccc; float: left; clear: both; }
        .msg-out { background: #E1F5FE; border: 1px solid #B3E5FC; float: right; clear: both; }
        .msg-author { font-size: 10px; color: #005B8A; font-weight: bold; margin-bottom: 2px; }
        .msg-tick { font-size: 10px; font-weight: bold; color: #005B8A; margin-left: 5px; }
        .msg-read { color: #2e7d32; }

        /* PING! Visual Indicator */
        .ping-bubble { background: #ffcdd2; border: 1px solid #e57373; color: #b71c1c; font-weight: bold; text-align: center; width: 95%; clear: both; float: none; margin: 8px auto; }
        .ping-shake { animation: shake 0.3s ease-in-out infinite; }
        @keyframes shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-8px, 0); } 50% { transform: translate(8px, 0); } 75% { transform: translate(-8px, 0); } 100% { transform: translate(0, 0); } }

        /* Controls / Input Bar */
        #input-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 45px; background: #ccc; padding: 6px; border-top: 1px solid #999; }
        #msg-input { width: 55%; padding: 6px; border: 1px solid #888; border-radius: 3px; float: left; font-size: 12px; }
        .chat-btn { width: 20%; height: 31px; float: right; margin-left: 2%; font-size: 11px; padding: 0; }
        .clear { clear: both; }
    </style>
</head>
<body>
    <div id="app">
        
        <!-- LOGIN / REGISTER VIEW -->
        <div id="login-view">
            <h2 style="margin-bottom:10px; color:#005B8A;">TestMessenger</h2>
            <input type="text" id="login-user" class="input-field" placeholder="Display Name (e.g. Nigel)" />
            <input type="password" id="login-pass" class="input-field" placeholder="Password" />
            <input type="text" id="login-status" class="input-field" placeholder="Status (e.g. Available - Chilling)" />
            <p style="text-align:left; font-size:11px; margin-bottom:3px; color:#444;">Profile Picture (Optional):</p>
            <input type="file" id="login-avatar" class="input-field" accept="image/*" />
            
            <button class="btn" style="width:100%; margin-top:5px;" onclick="doLogin()">Sign In / Register</button>
            <br><br>
            <button class="btn btn-danger" style="width:100%; font-size:11px;" onclick="wipeDatabase()">Wipe Server Database (Reset All)</button>
        </div>

        <!-- HOME / MAIN VIEW -->
        <div id="home-view">
            <div class="bb-header">
                <div class="avatar" id="my-avatar"></div>
                <div class="user-meta">
                    <h1><span class="status-dot"></span><span id="my-name">---</span></h1>
                    <div class="pin-tag">PIN: <span id="my-pin">--------</span></div>
                    <div class="user-status-text" id="my-status">Available</div>
                </div>
            </div>

            <div id="home-content">
                <div style="padding: 6px; background: #e0e5e8; border-bottom: 1px solid #ccc;">
                    <input type="text" id="add-pin-input" class="input-field" style="width:68%; margin:0; float:left;" placeholder="Enter PIN..." />
                    <button class="btn" style="width:28%; float:right; padding:6px;" onclick="addContactByPin()">+ Contact</button>
                    <div class="clear"></div>
                </div>

                <div class="accordion yellow">Recent Updates</div>
                <div id="recent-updates-list"></div>

                <div class="accordion">Contacts</div>
                <div id="contacts-list"></div>

                <div style="padding:10px;">
                    <button class="btn btn-secondary" style="width:100%; font-size:11px;" onclick="sendBroadcast()">Broadcast Message to All</button>
                </div>
            </div>
        </div>

        <!-- CHAT VIEW -->
        <div id="chat-view">
            <div id="chat-header">
                <button id="back-btn" onclick="showHome()">&lsaquo;</button>
                <div class="avatar-sm" id="chat-target-avatar"></div>
                <div id="chat-title-text">Chat</div>
            </div>

            <div id="chat-messages"></div>

            <div id="input-bar">
                <input type="text" id="msg-input" placeholder="Type message..." />
                <button class="btn chat-btn" style="background:#a00; border-color:#600;" onclick="sendPing()">PING!</button>
                <button class="btn chat-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <script>
        // STRICT ES5 JAVASCRIPT FOR BBOS 7 COMPATIBILITY
        var currentUser = null;
        var currentTarget = null;
        var allUsers = {};
        var allMessages = [];
        var allUpdates = [];
        var ws = null;
        var base64Avatar = '';

        // Read Base64 Image Profile Picture
        document.getElementById('login-avatar').onchange = function(e) {
            var file = e.target.files[0];
            if (file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    base64Avatar = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        function ajaxPost(url, data, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    var res = JSON.parse(xhr.responseText);
                    if (xhr.status === 200) {
                        if (callback) callback(res);
                    } else {
                        alert(res.error || 'Server error');
                    }
                }
            };
            xhr.send(JSON.stringify(data));
        }

        function wipeDatabase() {
            if (confirm('Are you sure you want to wipe all BBM data and start fresh?')) {
                ajaxPost('/api/reset', {}, function() {
                    alert('Database wiped!');
                    location.reload();
                });
            }
        }

        function doLogin() {
            var u = document.getElementById('login-user').value;
            var p = document.getElementById('login-pass').value;
            var s = document.getElementById('login-status').value;

            if (!u || !p) return alert('Username and Password required');

            ajaxPost('/api/login', { username: u, password: p, statusMessage: s, avatar: base64Avatar }, function(res) {
                currentUser = res.user;
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('home-view').style.display = 'block';

                document.getElementById('my-name').innerText = currentUser.username;
                document.getElementById('my-pin').innerText = currentUser.pin;
                document.getElementById('my-status').innerText = currentUser.statusMessage;
                if (currentUser.avatar) {
                    document.getElementById('my-avatar').style.backgroundImage = 'url(' + currentUser.avatar + ')';
                }

                initRealtime();
            });
        }

        function initRealtime() {
            try {
                ws = new WebSocket('ws://' + location.host);
                ws.onopen = function() {
                    ws.send(JSON.stringify({ type: 'AUTH', username: currentUser.username }));
                };
                ws.onmessage = function(evt) {
                    var data = JSON.parse(evt.data);
                    if (data.type === 'STATE_UPDATE') {
                        var prevLen = allMessages.length;
                        allUsers = data.users;
                        allMessages = data.messages;
                        allUpdates = data.updates;

                        renderHome();
                        if (currentTarget) renderChat();

                        // Detect incoming PING!
                        if (allMessages.length > prevLen) {
                            var last = allMessages[allMessages.length - 1];
                            if (last.target === currentUser.username && last.isPing) {
                                triggerPingEffect();
                            }
                        }
                    }
                };
                ws.onerror = function() { startPolling(); };
            } catch (e) {
                startPolling();
            }
        }

        function startPolling() {
            setInterval(function() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/sync?username=' + encodeURIComponent(currentUser.username), true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        var data = JSON.parse(xhr.responseText);
                        allUsers = data.users;
                        allMessages = data.messages;
                        allUpdates = data.updates;
                        renderHome();
                        if (currentTarget) renderChat();
                    }
                };
                xhr.send();
            }, 2000);
        }

        function addContactByPin() {
            var pin = document.getElementById('add-pin-input').value;
            if (!pin) return alert('Enter a PIN');

            ajaxPost('/api/add-contact', { username: currentUser.username, pin: pin }, function(res) {
                alert('Contact added: ' + res.added);
                document.getElementById('add-pin-input').value = '';
            });
        }

        function sendBroadcast() {
            var text = prompt('Enter message to broadcast to all contacts:');
            if (text && ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'BROADCAST', text: text }));
            }
        }

        function showHome() {
            currentTarget = null;
            document.getElementById('chat-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            renderHome();
        }

        function openChat(target) {
            currentTarget = target;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('chat-view').style.display = 'block';

            document.getElementById('chat-title-text').innerText = target;
            var targetAvatar = (allUsers[target] && allUsers[target].avatar) ? allUsers[target].avatar : '';
            document.getElementById('chat-target-avatar').style.backgroundImage = targetAvatar ? 'url(' + targetAvatar + ')' : '';

            renderChat();
        }

        function renderHome() {
            // Render Updates
            var upHtml = '';
            for (var i = 0; i < allUpdates.length && i < 5; i++) {
                var u = allUpdates[i];
                upHtml += '<div class="list-item">' +
                    '<div class="item-title">' + u.user + '</div>' +
                    '<div class="status-msg">' + u.text + '</div>' +
                    '</div>';
            }
            document.getElementById('recent-updates-list').innerHTML = upHtml || '<div class="list-item"><div class="status-msg">No updates yet</div></div>';

            // Render Contacts
            var cHtml = '';
            var myContacts = (allUsers[currentUser.username] && allUsers[currentUser.username].contacts) ? allUsers[currentUser.username].contacts : [];

            for (var j = 0; j < myContacts.length; j++) {
                var cName = myContacts[j];
                var cData = allUsers[cName] || { online: false, statusMessage: 'Offline', avatar: '' };
                var dotClass = cData.online ? 'status-dot' : 'status-dot offline-dot';
                var bgStyle = cData.avatar ? 'background-image:url(' + cData.avatar + ')' : '';

                cHtml += '<div class="list-item" tabindex="0" onclick="openChat(\'' + cName + '\')">' +
                    '<div class="avatar-sm" style="' + bgStyle + '"></div>' +
                    '<div style="float:left;">' +
                    '<div class="item-title"><span class="' + dotClass + '"></span>' + cName + '</div>' +
                    '<div class="status-msg">' + cData.statusMessage + '</div>' +
                    '</div></div>';
            }
            document.getElementById('contacts-list').innerHTML = cHtml || '<div class="list-item"><div class="status-msg">No contacts. Add a friend by PIN above!</div></div>';
        }

        function renderChat() {
            var html = '';
            var unreadFound = false;

            for (var i = 0; i < allMessages.length; i++) {
                var m = allMessages[i];
                if ((m.sender === currentUser.username && m.target === currentTarget) ||
                    (m.sender === currentTarget && m.target === currentUser.username)) {

                    if (m.isPing) {
                        html += '<div class="msg ping-bubble">!!! PING !!!<br><span style="font-size:9px;">' + m.timestamp + '</span></div>';
                    } else {
                        var isMe = m.sender === currentUser.username;
                        var tick = isMe ? (m.status === 'read' ? ' <span class="msg-tick msg-read">R✓</span>' : (m.status === 'delivered' ? ' <span class="msg-tick">D✓</span>' : ' <span class="msg-tick">✓</span>')) : '';
                        html += '<div class="msg ' + (isMe ? 'msg-out' : 'msg-in') + '">' +
                            '<div class="msg-author">' + m.sender + '</div>' +
                            '<div>' + m.text + tick + '</div>' +
                            '</div>';
                    }

                    if (m.target === currentUser.username && m.status !== 'read') {
                        unreadFound = true;
                    }
                }
            }

            var win = document.getElementById('chat-messages');
            win.innerHTML = html;
            win.scrollTop = win.scrollHeight;

            if (unreadFound && ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'MARK_READ', sender: currentTarget }));
            }
        }

        function sendMessage() {
            var input = document.getElementById('msg-input');
            var text = input.value;
            if (!text) return;

            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'SEND_MSG', target: currentTarget, text: text }));
            }
            input.value = '';
        }

        function sendPing() {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'SEND_MSG', target: currentTarget, text: 'PING', isPing: true }));
            }
        }

        function triggerPingEffect() {
            document.getElementById('app').className = 'ping-shake';
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            setTimeout(function() {
                document.getElementById('app').className = '';
            }, 600);
        }

        document.getElementById('msg-input').onkeypress = function(e) {
            if (e.keyCode === 13) sendMessage();
        };
    </script>
</body>
</html>
