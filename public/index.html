<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encrypted BBM Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; background: #121212; color: #fff; display: flex; justify-content: center; }
        #app { width: 100%; max-width: 480px; height: 100%; background: #1e1e1e; display: flex; flex-direction: column; position: relative; border-left: 1px solid #333; border-right: 1px solid #333; }
        
        .header { background: #0a0a0a; padding: 12px; border-bottom: 2px solid #005B8A; display: flex; justify-content: space-between; align-items: center; }
        .pin-tag { color: #ffcc00; font-size: 11px; font-weight: bold; }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2e7d32; margin-right: 6px; }
        .offline { background: #666; }

        .view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        .input-field { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 14px; }
        .btn { padding: 10px 16px; background: #005B8A; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-danger { background: #a00; }

        .list-item { padding: 12px; border-bottom: 1px solid #2a2a2a; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .list-item:hover { background: #252525; }

        #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 13px; position: relative; word-wrap: break-word; }
        .msg-in { background: #2a2a2a; align-self: flex-start; border-bottom-left-radius: 0; }
        .msg-out { background: #005B8A; align-self: flex-end; border-bottom-right-radius: 0; }
        .tick { font-size: 10px; margin-left: 6px; opacity: 0.8; }

        .ping-msg { background: #5c0000; color: #ff9999; font-weight: bold; text-align: center; align-self: center; width: 90%; }
        .shake { animation: shake 0.3s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-6px, 0); } 75% { transform: translate(6px, 0); } }

        .input-bar { padding: 10px; background: #0a0a0a; display: flex; gap: 8px; border-top: 1px solid #2a2a2a; }
        .input-bar input { flex: 1; margin: 0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- LOGIN VIEW -->
        <div id="login-view" class="view" style="padding: 20px; justify-content: center;">
            <h2 style="margin-bottom: 16px; color: #005B8A; text-align: center;">E2EE BBM Messenger</h2>
            <input type="text" id="login-user" class="input-field" placeholder="Username" />
            <input type="password" id="login-pass" class="input-field" placeholder="Password" />
            <input type="text" id="login-status" class="input-field" placeholder="Status Message" />
            <button class="btn" onclick="doLogin()">Sign In / Register</button>
        </div>

        <!-- HOME VIEW -->
        <div id="home-view" class="view hidden">
            <div class="header">
                <div>
                    <div><span class="status-dot"></span><strong id="my-name">---</strong></div>
                    <div style="font-size: 11px; color: #aaa;" id="my-status">---</div>
                </div>
                <div class="pin-tag">PIN: <span id="my-pin">--------</span></div>
            </div>
            
            <div style="padding: 10px; background: #181818; display: flex; gap: 8px;">
                <input type="text" id="add-pin-input" class="input-field" style="margin:0;" placeholder="Add BBM PIN..." />
                <button class="btn" onclick="addContactByPin()">Add</button>
            </div>

            <div style="flex:1; overflow-y: auto;" id="contacts-list"></div>
        </div>

        <!-- CHAT VIEW -->
        <div id="chat-view" class="view hidden">
            <div class="header">
                <button class="btn" style="padding: 4px 8px;" onclick="showHome()">&lsaquo; Back</button>
                <strong id="chat-target-title">---</strong>
                <span style="font-size: 9px; color: #00ffcc;">🔒 E2EE Active</span>
            </div>

            <div id="messages"></div>

            <div class="input-bar">
                <input type="text" id="msg-input" class="input-field" placeholder="Encrypted message..." />
                <button class="btn btn-danger" onclick="sendPing()">PING!</button>
                <button class="btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentTarget = null;
        let keyPair = null;
        let authHash = null;
        let sharedKeys = {};
        let ws = null;
        let state = { users: {}, messages: [] };

        // --- WEB CRYPTO ENGINE (ECDH P-256 + AES-GCM 256) ---
        async function deriveAuthHash(password, username) {
            const enc = new TextEncoder();
            const buf = await crypto.subtle.digest('SHA-256', enc.encode(`${password}:${username}`));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function initCryptoKeys() {
            keyPair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey"]);
            const pubJwk = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
            return JSON.stringify(pubJwk);
        }

        async function getSharedKey(targetUser) {
            if (sharedKeys[targetUser]) return sharedKeys[targetUser];
            const targetPubKeyJwk = JSON.parse(state.users[targetUser].pubKey);
            const importedPubKey = await crypto.subtle.importKey("jwk", targetPubKeyJwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
            
            const sharedKey = await crypto.subtle.deriveKey(
                { name: "ECDH", public: importedPubKey },
                keyPair.privateKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
            sharedKeys[targetUser] = sharedKey;
            return sharedKey;
        }

        async function encryptPayload(targetUser, text) {
            const key = await getSharedKey(targetUser);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
            return {
                ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext))),
                iv: btoa(String.fromCharCode(...iv))
            };
        }

        async function decryptPayload(senderUser, ciphertextB64, ivB64) {
            try {
                const key = await getSharedKey(senderUser);
                const ciphertext = Uint8Array.from(atob(ciphertextB64), c => c.charCodeAt(0));
                const iv = Uint8Array.from(atob(ivB64), c => c.charCodeAt(0));
                const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch(e) {
                return "[Unable to decrypt message]";
            }
        }

        // --- NETWORK & APP LOGIC ---
        async function doLogin() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const s = document.getElementById('login-status').value.trim();

            if (!u || !p) return alert('Username & password required');

            authHash = await deriveAuthHash(p, u);
            const pubKeyStr = await initCryptoKeys();

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, authHash, pubKey: pubKeyStr, statusMessage: s })
            });

            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('home-view').classList.remove('hidden');
                document.getElementById('my-name').innerText = currentUser.username;
                document.getElementById('my-status').innerText = currentUser.statusMessage;
                document.getElementById('my-pin').innerText = currentUser.pin;
                initWebSocket();
            } else {
                alert(data.error);
            }
        }

        function initWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
            ws = new WebSocket(protocol + location.host);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'AUTH', username: currentUser.username }));
            };

            ws.onmessage = async (evt) => {
                const msg = JSON.parse(evt.data);
                if (msg.type === 'STATE_UPDATE') {
                    state = msg;
                    renderHome();
                    if (currentTarget) await renderChat();
                }
            };
        }

        async function addContactByPin() {
            const pin = document.getElementById('add-pin-input').value;
            const res = await fetch('/api/add-contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, pin })
            });
            const data = await res.json();
            if (res.ok) {
                alert(`Added ${data.added}`);
                document.getElementById('add-pin-input').value = '';
            } else {
                alert(data.error);
            }
        }

        function renderHome() {
            const myContacts = state.users[currentUser.username]?.contacts || [];
            let html = '';
            myContacts.forEach(c => {
                const u = state.users[c] || { online: false, statusMessage: 'Offline' };
                html += `
                    <div class="list-item" onclick="openChat('${c}')">
                        <div>
                            <div><span class="status-dot ${u.online ? '' : 'offline'}"></span><strong>${c}</strong></div>
                            <div style="font-size:11px; color:#aaa;">${u.statusMessage}</div>
                        </div>
                        <span style="color:#005B8A;">&rsaquo;</span>
                    </div>`;
            });
            document.getElementById('contacts-list').innerHTML = html || '<div style="padding:15px; color:#666;">No contacts. Add someone using their PIN above.</div>';
        }

        function showHome() {
            currentTarget = null;
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
        }

        async function openChat(target) {
            currentTarget = target;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
            document.getElementById('chat-target-title').innerText = target;
            await renderChat();
        }

        async function renderChat() {
            const win = document.getElementById('messages');
            let html = '';

            for (const m of state.messages) {
                if ((m.sender === currentUser.username && m.target === currentTarget) ||
                    (m.sender === currentTarget && m.target === currentUser.username)) {
                    
                    if (m.isPing) {
                        html += `<div class="msg ping-msg">!!! PING !!!</div>`;
                    } else {
                        const isMe = m.sender === currentUser.username;
                        const otherUser = isMe ? currentTarget : m.sender;
                        const decryptedText = await decryptPayload(otherUser, m.ciphertext, m.iv);
                        const tick = isMe ? (m.status === 'read' ? 'R✓' : m.status === 'delivered' ? 'D✓' : '✓') : '';
                        
                        html += `
                            <div class="msg ${isMe ? 'msg-out' : 'msg-in'}">
                                ${decryptedText}
                                ${isMe ? `<span class="tick">${tick}</span>` : ''}
                            </div>`;
                    }
                }
            }
            win.innerHTML = html;
            win.scrollTop = win.scrollHeight;

            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ type: 'MARK_READ', sender: currentTarget }));
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentTarget) return;

            const encrypted = await encryptPayload(currentTarget, text);
            ws.send(JSON.stringify({
                type: 'SEND_MSG',
                target: currentTarget,
                ciphertext: encrypted.ciphertext,
                iv: encrypted.iv
            }));
            input.value = '';
        }

        async function sendPing() {
            const encrypted = await encryptPayload(currentTarget, 'PING');
            ws.send(JSON.stringify({
                type: 'SEND_MSG',
                target: currentTarget,
                ciphertext: encrypted.ciphertext,
                iv: encrypted.iv,
                isPing: true
            }));
        }

        document.getElementById('msg-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
